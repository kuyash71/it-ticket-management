server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/itsm}
    username: ${DB_USERNAME:itsm}
    password: ${DB_PASSWORD:itsm}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  messages:
    basename: i18n/messages
    encoding: UTF-8
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=30s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/itsm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/itsm/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4317
  metrics:
    tags:
      application: itsm-backend

springdoc:
  swagger-ui:
    path: /swagger-ui.html

observability:
  opensearch:
    url: ${OPENSEARCH_URL:http://localhost:9200}
    index: ${OPENSEARCH_INDEX:itsm-logs}

itsm:
  attachments:
    storage-path: ${ATTACHMENT_STORAGE_PATH:/var/itsm/attachments}
    max-size-bytes: 10485760  # 10 MB (Doc §7)

logging:
  config: classpath:log4j2-spring.xml
